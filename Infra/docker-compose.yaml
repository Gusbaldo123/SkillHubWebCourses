version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"        
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    build:
      context: ../WebApi
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__SkillhubDatabase: "Server=${DB_HOST},${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;"

      Mail__host: ${MAIL_HOST}
      Mail__port: ${MAIL_PORT}
      Mail__user: ${MAIL_USER}
      Mail__password: ${MAIL_PASSWORD}
      Mail__enableSSL: ${MAIL_ENABLE_SSL}
      Mail__sender: ${MAIL_SENDER}

    depends_on:
      - sqlserver
      - redis

volumes:
  mssql_data: